<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPECTRE - Jack In</title>
    <!-- High-tech, premium cyber fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        :root {
            --bg-base: #030000;
            --brand-red: #ff1a1a;
            --brand-dark-red: #7a0000;
            --brand-yellow: #ffe600;
            --glass-bg: rgba(10, 0, 0, 0.65);
            --glass-border: rgba(255, 26, 26, 0.2);
            --text-main: #ffffff;
            --text-muted: #8b8b99;
            --input-bg: rgba(25, 0, 0, 0.4);
            --font-ui: 'Space Grotesk', sans-serif;
            --font-mono: 'Fira Code', monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: var(--font-ui);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
            background-image: 
                linear-gradient(rgba(255, 26, 26, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 26, 26, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        /* Ambient Glow Backgrounds */
        .ambient-glow {
            position: absolute;
            width: 800px;
            height: 800px;
            border-radius: 50%;
            filter: blur(140px);
            z-index: 0;
            opacity: 0.4;
            animation: pulse 8s infinite alternate ease-in-out;
        }
        
        .glow-red {
            background: radial-gradient(circle, var(--brand-red) 0%, transparent 60%);
            top: -20%;
            left: -10%;
        }

        .glow-dark {
            background: radial-gradient(circle, var(--brand-dark-red) 0%, transparent 60%);
            bottom: -20%;
            right: -10%;
            animation-delay: -4s;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.3; }
            100% { transform: scale(1.1); opacity: 0.5; }
        }

        /* Main Container */
        .auth-container {
            position: relative;
            z-index: 1;
            width: 90%;
            max-width: 1050px;
            min-height: 650px;
            margin: 2rem 0;
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-radius: 4px;
            display: flex;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), 0 0 40px rgba(255, 26, 26, 0.1);
        }

        .auth-container::before, .auth-container::after {
            content: '';
            position: absolute;
            width: 30px;
            height: 30px;
            border: 2px solid var(--brand-red);
            z-index: 10;
            pointer-events: none;
        }
        .auth-container::before {
            top: -1px; left: -1px;
            border-right: none; border-bottom: none;
        }
        .auth-container::after {
            bottom: -1px; right: -1px;
            border-left: none; border-top: none;
        }

        /* Left Side: Brand/Visual */
        .visual-panel {
            flex: 1;
            position: relative;
            background: linear-gradient(135deg, rgba(30, 0, 0, 0.8), rgba(0, 0, 0, 0.9));
            border-right: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            padding: 3rem;
            overflow: hidden;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 4px;
            z-index: 2;
            color: var(--text-main);
            text-shadow: 0 0 10px rgba(255, 26, 26, 0.5);
        }
        
        .brand-icon {
            width: 36px;
            height: 36px;
            border: 2px solid var(--brand-red);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .brand-icon::after {
            content: '';
            position: absolute;
            width: 14px;
            height: 14px;
            background: var(--brand-red);
        }

        .cyber-grid {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 300px;
            border: 1px dashed rgba(255, 26, 26, 0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: rotate-grid 20s linear infinite;
        }
        
        .cyber-grid::before {
            content: '';
            position: absolute;
            width: 200px;
            height: 200px;
            border: 1px solid rgba(255, 26, 26, 0.5);
            border-radius: 50%;
            animation: rotate-grid 15s linear infinite reverse;
        }

        .cyber-grid::after {
            content: '';
            position: absolute;
            width: 100px;
            height: 100px;
            border: 2px solid var(--brand-red);
            background: rgba(255, 26, 26, 0.1);
            transform: rotate(45deg);
            box-shadow: 0 0 30px rgba(255, 26, 26, 0.4);
        }

        @keyframes rotate-grid {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }

        .sys-status {
            position: absolute;
            bottom: 3rem;
            left: 3rem;
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: var(--brand-red);
            line-height: 1.6;
            opacity: 0.8;
        }

        /* Right Side: Form */
        .form-panel {
            flex: 1.2;
            padding: 2.5rem 4rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            background: rgba(0, 0, 0, 0.3);
        }

        .form-header {
            margin-bottom: 2rem;
        }

        .form-header h2 {
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .form-header p {
            color: var(--text-muted);
            font-size: 0.95rem;
            font-family: var(--font-mono);
        }

        .form-header span.highlight {
            color: var(--brand-red);
        }

        .glass-form {
            position: relative;
        }

        .input-group {
            margin-bottom: 1.2rem;
        }

        .input-group label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            color: var(--text-main);
            margin-bottom: 0.5rem;
            font-family: var(--font-mono);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper::before {
            content: '>>';
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--brand-red);
            font-family: var(--font-mono);
            font-size: 0.9rem;
            opacity: 0.7;
        }

        .input-wrapper input {
            width: 100%;
            padding: 12px 16px 12px 45px;
            background: var(--input-bg);
            border: 1px solid var(--glass-border);
            border-radius: 2px;
            color: var(--brand-yellow);
            font-family: var(--font-mono);
            font-size: 0.9rem;
            transition: all 0.3s ease;
            outline: none;
        }

        .input-wrapper input:focus {
            border-color: var(--brand-red);
            background: rgba(255, 26, 26, 0.1);
            box-shadow: 0 0 15px rgba(255, 26, 26, 0.2), inset 0 0 10px rgba(255, 26, 26, 0.1);
        }

        .input-wrapper input::placeholder {
            color: rgba(255, 255, 255, 0.2);
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            border: 1px solid var(--brand-red);
            border-radius: 2px;
            background: rgba(255, 26, 26, 0.1);
            color: var(--text-main);
            font-weight: 600;
            font-family: var(--font-mono);
            font-size: 0.95rem;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 0.5rem;
            text-transform: uppercase;
        }

        .btn-primary:hover:not(:disabled) {
            background: var(--brand-red);
            color: #000;
            box-shadow: 0 0 20px rgba(255, 26, 26, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            border-color: var(--text-muted);
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 1.5rem 0;
            color: var(--brand-red);
            font-family: var(--font-mono);
            font-size: 0.75rem;
            opacity: 0.6;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            border-top: 1px dashed var(--brand-red);
        }

        .divider span {
            padding: 0 1rem;
        }

        .auth-tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 0.5rem;
        }

        .tab {
            font-family: var(--font-mono);
            font-size: 0.85rem;
            color: var(--text-muted);
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: color 0.2s;
            position: relative;
            background: transparent;
            border: none;
        }

        .tab:hover { color: var(--text-main); }
        .tab.active { color: var(--brand-red); }
        .tab.active::after {
            content: '';
            position: absolute;
            bottom: -9px;
            left: 0;
            width: 100%;
            height: 2px;
            background: var(--brand-red);
            box-shadow: 0 -2px 10px var(--brand-red);
        }

        /* Utilities */
        .hidden { display: none !important; }
        .error-text { color: var(--brand-red); font-size: 0.75rem; font-family: var(--font-mono); text-align: center; margin: 0.5rem 0; }
        .success-text { color: #0f0; font-size: 0.75rem; font-family: var(--font-mono); margin-top: 0.3rem; }
        
        .btn-small {
            background: rgba(255, 26, 26, 0.1);
            color: var(--text-main);
            border: 1px solid var(--brand-red);
            font-family: var(--font-mono);
            font-size: 0.75rem;
            padding: 0 1rem;
            cursor: pointer;
            transition: 0.2s;
            text-transform: uppercase;
            white-space: nowrap;
        }
        .btn-small:hover:not(:disabled) {
            background: var(--brand-red);
            color: #000;
        }
        .btn-small:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .radio-group { display: flex; gap: 1rem; font-family: var(--font-mono); font-size: 0.8rem; color: var(--text-muted); }
        .radio-group label { cursor: pointer; transition: color 0.2s; display: flex; align-items: center; gap: 0.5rem; }
        .radio-group label:hover { color: var(--text-main); }
        .radio-group input[type="radio"] { accent-color: var(--brand-red); cursor: pointer; }

        /* Modal Overlay */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-card {
            background: var(--glass-bg);
            border: 1px solid var(--brand-red);
            border-radius: 4px;
            padding: 2.5rem;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 0 30px rgba(255, 26, 26, 0.2);
            position: relative;
        }
        
        .badge {
            border: 1px solid var(--glass-border);
            background: rgba(0,0,0,0.5);
            padding: 1rem;
            margin-bottom: 1.5rem;
            text-align: center;
            font-family: var(--font-mono);
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        @media (max-width: 768px) {
            .auth-container { flex-direction: column; height: auto; min-height: 100vh; border-radius: 0; width: 100%; border: none; margin: 0; }
            .visual-panel { display: none; }
            .form-panel { padding: 2rem; }
        }
    </style>
</head>
<body>

    <div class="ambient-glow glow-red"></div>
    <div class="ambient-glow glow-dark"></div>

    <div class="auth-container">
        <!-- Left: Visual Side -->
        <div class="visual-panel">
            <div class="brand-logo">
                <div class="brand-icon"></div>
                SPECTRE
            </div>
            <div class="cyber-grid"></div>
            <div class="sys-status">
                SYS.NODE: NIGHTJAR_01<br>
                ENC: AES-256-GCM<br>
                STATUS: SECURE CONNECTION<br>
                AWAITING AUTHENTICATION...
            </div>
        </div>

        <!-- Right: Form Side -->
        <div class="form-panel">
            <div class="auth-tabs">
                <button type="button" class="tab active" id="tab-login" onclick="setMode('login')">Jack-In (Login)</button>
                <button type="button" class="tab" id="tab-register" onclick="setMode('register')">Initialize (Register)</button>
            </div>

            <div class="form-header">
                <h2>Authenticate</h2>
                <p>Provide <span class="highlight">credentials</span> to access the network.</p>
            </div>

            <form id="auth-form" class="glass-form" onsubmit="submitForm(event)">
                
                <!-- Registration Fields -->
                <div id="register-fields" class="hidden">
                    <div class="input-group">
                        <label><span>Agent Email</span></label>
                        <div style="display: flex; gap: 0.5rem;">
                            <div class="input-wrapper" style="flex: 1;">
                                <input type="email" id="email" placeholder="AGENT_EMAIL@DOMAIN.COM">
                            </div>
                            <button type="button" class="btn-small" id="btn-send-code" onclick="sendCode()">SEND CODE</button>
                        </div>
                        <div id="code-msg" class="success-text"></div>
                    </div>

                    <div class="input-group">
                        <label><span>Auth Code</span></label>
                        <div class="input-wrapper">
                            <input type="text" id="verification_code" placeholder="6-DIGIT_CODE">
                        </div>
                    </div>

                </div>

                <!-- Common Fields -->
                <div class="input-group">
                    <label><span>Codename</span></label>
                    <div class="input-wrapper">
                        <input type="text" id="username" placeholder="AGENT_USERNAME" required>
                    </div>
                </div>

                <div class="input-group">
                    <label><span>Access Code</span></label>
                    <div class="input-wrapper">
                        <input type="password" id="password" placeholder="••••••••••••" required>
                    </div>
                </div>

                <div id="error-msg" class="error-text"></div>

                <button type="submit" id="btn-submit" class="btn-primary">AUTHENTICATE (LOGIN)</button>
            </form>

            <div class="divider">
                <span>SECURE OAUTH</span>
            </div>

            <div id="google-auth-section" style="display: flex; flex-direction: column; align-items: center;">
                <div id="google-btn-wrapper"></div>
                <div id="google-config-notice" class="error-text hidden" style="margin-top: 1rem;">
                    [SYS ADVISORY: Set GOOGLE_CLIENT_ID in .env]
                </div>
            </div>
        </div>
    </div>

    <!-- Modal: New Google Operative Profile Setup -->
    <div id="google-setup-modal" class="modal-overlay hidden">
        <div class="modal-card">
            <h2 style="font-family: var(--font-ui); text-transform: uppercase; margin-bottom: 1rem; font-size: 1.5rem; text-align: center;">Operative Config</h2>
            
            <div class="badge">
                VERIFIED BY GOOGLE:<br>
                <span id="g-email-badge" style="color: #0f0; display: block; margin-top: 0.5rem; word-break: break-all;"></span>
            </div>
            
            <div class="input-group">
                <label><span>Codename</span></label>
                <div class="input-wrapper">
                    <input type="text" id="g-username" placeholder="e.g. Spectre_07" required>
                </div>
            </div>


            <div id="g-modal-err" class="error-text"></div>

            <button type="button" id="btn-complete-google" class="btn-primary" onclick="completeGoogleRegistration()">INITIALIZE & JACK IN</button>
            <button type="button" class="tab" style="width: 100%; display: block; text-align: center; margin-top: 1rem;" onclick="closeGoogleModal()">[ ABORT CONFIGURATION ]</button>
        </div>
    </div>

    <script>
    let mode = 'login'; 
    let googleTokenCache = null;

    function errText(data, fallback) {
        const d = data && data.detail;
        if (typeof d === 'string' && d) return d;
        if (Array.isArray(d) && d.length) {
            return d.map(x => (x && x.msg) ? x.msg : String(x)).join('; ');
        }
        return fallback;
    }

    window.addEventListener('DOMContentLoaded', initGoogleAuth);

    async function initGoogleAuth() {
        try {
            const res = await fetch('/api/auth/config');
            const config = await res.json();
            
            if (config.google_client_id) {
                google.accounts.id.initialize({
                    client_id: config.google_client_id,
                    callback: handleGoogleCredentialResponse,
                    auto_select: false
                });
                google.accounts.id.renderButton(
                    document.getElementById("google-btn-wrapper"),
                    { theme: "filled_black", size: "large", text: "continue_with", shape: "rectangular", width: 280 }
                );
            } else {
                document.getElementById('google-config-notice').classList.remove('hidden');
            }
        } catch(e) {
            console.warn("Google Auth initialization deferred:", e);
        }
    }

    async function handleGoogleCredentialResponse(response) {
        const idToken = response.credential;
        googleTokenCache = idToken;
        const err = document.getElementById('error-msg');
        err.innerText = '';

        try {
            const body = new URLSearchParams({ id_token: idToken });
            const res = await fetch('/api/auth/google', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: body
            });
            const data = await res.json();

            if (res.ok) {
                if (data.status === 'authenticated') {
                    window.location.href = '/hub';
                } else if (data.status === 'needs_profile') {
                    document.getElementById('g-email-badge').innerText = data.email;
                    if (data.suggested_username) {
                        document.getElementById('g-username').value = data.suggested_username;
                    }
                    document.getElementById('google-setup-modal').classList.remove('hidden');
                }
            } else {
                err.innerText = errText(data, "Google authentication failed");
            }
        } catch(e) {
            err.innerText = "System offline. Could not contact auth server.";
        }
    }

    function setMode(newMode) {
        mode = newMode;
        document.getElementById('tab-login').classList.toggle('active', mode === 'login');
        document.getElementById('tab-register').classList.toggle('active', mode === 'register');
        
        document.getElementById('register-fields').classList.toggle('hidden', mode === 'login');
        document.getElementById('btn-submit').innerText = mode === 'register' ? 'INITIALIZE (REGISTER)' : 'AUTHENTICATE (LOGIN)';
        
        document.getElementById('error-msg').innerText = '';
        document.getElementById('code-msg').innerText = '';
    }

    function closeGoogleModal() {
        document.getElementById('google-setup-modal').classList.add('hidden');
        googleTokenCache = null;
        document.getElementById('g-modal-err').innerText = '';
    }

    async function completeGoogleRegistration() {
        if (!googleTokenCache) return;
        const username = document.getElementById('g-username').value.trim();
        const err = document.getElementById('g-modal-err');
        err.innerText = '';

        if (!username) {
            err.innerText = "Please specify an operative codename.";
            return;
        }

        const btn = document.getElementById('btn-complete-google');
        btn.disabled = true;
        btn.innerText = "INITIALIZING...";

        try {
            const body = new URLSearchParams({
                id_token: googleTokenCache,
                username: username
            });
            const res = await fetch('/api/auth/google', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: body
            });
            const data = await res.json();
            if (res.ok && data.status === 'authenticated') {
                window.location.href = '/hub';
            } else {
                err.innerText = errText(data, "Initialization failed");
                btn.disabled = false;
                btn.innerText = "INITIALIZE & JACK IN";
            }
        } catch(e) {
            err.innerText = "Network error. Try again.";
            btn.disabled = false;
            btn.innerText = "INITIALIZE & JACK IN";
        }
    }

    async function sendCode() {
        const email = document.getElementById('email').value;
        const btn = document.getElementById('btn-send-code');
        const msg = document.getElementById('code-msg');
        const err = document.getElementById('error-msg');
        
        err.innerText = '';
        msg.innerText = '';
        
        if (!email) {
            err.innerText = "Please enter an email address first.";
            return;
        }
        
        btn.disabled = true;
        btn.innerText = "SENDING...";
        
        try {
            const body = new URLSearchParams({ email: email });
            const res = await fetch('/api/send-code', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: body
            });
            const data = await res.json();
            
            if (res.ok) {
                msg.innerText = data.delivery === 'console'
                    ? "Code generated! Check the server console output (dev mode: email delivery is not configured)."
                    : "Code sent! Check your inbox (and spam folder). It expires in 15 minutes.";
            } else {
                err.innerText = errText(data, "Failed to send code");
            }
        } catch(e) {
            err.innerText = "System offline.";
        } finally {
            btn.disabled = false;
            btn.innerText = "SEND CODE";
        }
    }

    async function submitForm(e) {
        e.preventDefault();
        const user = document.getElementById('username').value;
        const pass = document.getElementById('password').value;
        const err = document.getElementById('error-msg');
        err.innerText = '';
        
        const url = mode === 'register' ? '/api/register' : '/api/login';
        let body;
        
        if (mode === 'register') {
            const email = document.getElementById('email').value;
            const vCode = document.getElementById('verification_code').value;
            
            if (!email || !vCode) {
                err.innerText = "Email and verification code are required.";
                return;
            }
            
            body = new URLSearchParams({ 
                email: email,
                verification_code: vCode,
                username: user, 
                password: pass
            });
        } else {
            body = new URLSearchParams({ username: user, password: pass });
        }
        
        try {
            const btn = document.getElementById('btn-submit');
            btn.disabled = true;
            btn.innerText = "PROCESSING...";
            
            const res = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: body
            });
            const data = await res.json();
            if (res.ok) {
                window.location.href = '/hub';
            } else {
                err.innerText = errText(data, "Authentication Failed");
                btn.disabled = false;
                btn.innerText = mode === 'register' ? 'INITIALIZE (REGISTER)' : 'AUTHENTICATE (LOGIN)';
            }
        } catch(error) {
            document.getElementById('error-msg').innerText = "System offline.";
            const btn = document.getElementById('btn-submit');
            btn.disabled = false;
            btn.innerText = mode === 'register' ? 'INITIALIZE (REGISTER)' : 'AUTHENTICATE (LOGIN)';
        }
    }
    </script>
</body>
</html>
