<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NIGHTJAR — Admin Console</title>
<meta name="description" content="SPECTRE NIGHTJAR Admin Console — manage players, scores, and event operations">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#060008;--surface:#0c0014;--card:#0f0018;--red:#ff1a1a;--red-dim:#5a0a0a;--red-glow:rgba(255,26,26,.25);--yel:#ffe600;--yel-dim:#a09200;--cyan:#00f0ff;--cyan-dim:#005a60;--ink:#ffd9d9;--ink-dim:#8a6a6a;--green:#00ff6a;--green-dim:#005a28;--border:rgba(255,26,26,.3);--radius:6px}
html{height:100%;scrollbar-width:thin;scrollbar-color:var(--red-dim) var(--bg)}
body{min-height:100%;background:var(--bg);color:var(--ink);font-family:"JetBrains Mono","Courier New",monospace;font-size:13px;line-height:1.6;overflow-x:hidden}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:9999;background:repeating-linear-gradient(0deg,rgba(0,0,0,.15) 0 2px,transparent 2px 4px)}

/* ─── Header ─── */
.header{position:sticky;top:0;z-index:100;background:rgba(6,0,8,.92);backdrop-filter:blur(16px);border-bottom:2px solid var(--red);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.header-brand{display:flex;align-items:center;gap:12px}
.header h1{font-family:"Press Start 2P",monospace;font-size:14px;color:var(--red);text-shadow:0 0 12px rgba(255,26,26,.6);letter-spacing:1px}
.header h1 span{color:var(--yel)}
.header-status{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--ink-dim)}
.status-dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.header-actions{display:flex;gap:8px}

/* ─── Buttons ─── */
.btn{font-family:inherit;font-size:11px;padding:8px 16px;border:1px solid var(--red);background:transparent;color:var(--red);cursor:pointer;transition:all .2s;border-radius:var(--radius);position:relative;overflow:hidden;white-space:nowrap}
.btn:hover{background:var(--red);color:#000;box-shadow:0 0 20px var(--red-glow)}
.btn:active{transform:scale(.96)}
.btn-danger{border-color:#ff3a3a;color:#ff3a3a}
.btn-danger:hover{background:#ff3a3a;color:#000;box-shadow:0 0 20px rgba(255,58,58,.4)}
.btn-yellow{border-color:var(--yel);color:var(--yel)}
.btn-yellow:hover{background:var(--yel);color:#000;box-shadow:0 0 20px rgba(255,230,0,.3)}
.btn-cyan{border-color:var(--cyan);color:var(--cyan)}
.btn-cyan:hover{background:var(--cyan);color:#000;box-shadow:0 0 20px rgba(0,240,255,.3)}
.btn-green{border-color:var(--green);color:var(--green)}
.btn-green:hover{background:var(--green);color:#000;box-shadow:0 0 20px rgba(0,255,106,.3)}
.btn-sm{padding:5px 10px;font-size:10px}
.btn-icon{display:inline-flex;align-items:center;gap:6px}

/* ─── Layout ─── */
.container{max-width:1400px;margin:0 auto;padding:20px 24px 40px}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:28px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;position:relative;overflow:hidden;transition:border-color .3s,box-shadow .3s}
.stat-card:hover{border-color:var(--red);box-shadow:0 4px 30px var(--red-glow)}
.stat-card::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--red),var(--yel));opacity:.7}
.stat-label{font-size:10px;color:var(--ink-dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
.stat-value{font-family:"Press Start 2P",monospace;font-size:22px;color:var(--yel);text-shadow:0 0 10px rgba(255,230,0,.3)}
.stat-sub{font-size:10px;color:var(--ink-dim);margin-top:6px}

/* ─── Toolbar ─── */
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.toolbar-left{display:flex;align-items:center;gap:12px}
.search-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:8px 12px;color:var(--ink);font-family:inherit;font-size:12px;width:240px;transition:border-color .2s}
.search-box:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 12px rgba(0,240,255,.15)}
.search-box::placeholder{color:var(--ink-dim)}

/* ─── Players Table ─── */
.panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:20px}
.panel-header{background:var(--surface);padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:8px}
.panel-title{font-family:"Press Start 2P",monospace;font-size:11px;color:var(--red);display:flex;align-items:center;gap:8px}
.panel-title::before{content:"▸";color:var(--yel);font-size:14px}
.badge{background:var(--red-dim);color:var(--yel);font-size:10px;padding:2px 8px;border-radius:10px;font-family:inherit}

table{width:100%;border-collapse:collapse}
thead th{background:rgba(255,26,26,.06);padding:10px 14px;text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--ink-dim);border-bottom:1px solid var(--border);white-space:nowrap;position:sticky;top:0}
tbody tr{border-bottom:1px solid rgba(255,26,26,.08);transition:background .15s}
tbody tr:hover{background:rgba(255,26,26,.04)}
tbody td{padding:10px 14px;vertical-align:middle}
.player-name{color:var(--yel);font-weight:700;font-size:13px;display:flex;align-items:center;gap:6px}
.player-rank{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;font-size:10px;font-weight:700;flex-shrink:0}
.rank-1{background:var(--yel);color:#000;box-shadow:0 0 10px rgba(255,230,0,.5)}
.rank-2{background:#c0c0c0;color:#000}
.rank-3{background:#cd7f32;color:#000}
.rank-n{background:var(--red-dim);color:var(--ink-dim)}
.score-val{font-family:"Press Start 2P",monospace;font-size:14px;color:var(--green);text-shadow:0 0 8px rgba(0,255,106,.3)}
.room-badge{background:var(--cyan-dim);color:var(--cyan);padding:3px 10px;border-radius:3px;font-size:11px;font-family:"Press Start 2P",monospace}
.actions-cell{display:flex;gap:4px;flex-wrap:wrap}

/* ─── Inline Edit ─── */
.inline-edit{display:inline-flex;align-items:center;gap:4px}
.inline-input{width:70px;background:var(--surface);border:1px solid var(--cyan-dim);color:var(--cyan);padding:4px 6px;font-family:"Press Start 2P",monospace;font-size:11px;border-radius:3px;text-align:center}
.inline-input:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 8px rgba(0,240,255,.2)}

/* ─── Toast ─── */
.toast-container{position:fixed;bottom:24px;right:24px;z-index:10000;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:var(--card);border:1px solid var(--green);color:var(--green);padding:12px 18px;border-radius:var(--radius);font-size:11px;box-shadow:0 4px 24px rgba(0,0,0,.6);pointer-events:auto;animation:toastIn .3s ease;display:flex;align-items:center;gap:8px}
.toast.error{border-color:var(--red);color:var(--red)}
@keyframes toastIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}

/* ─── Modal ─── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);z-index:5000;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.modal-overlay.active{opacity:1;pointer-events:auto}
.modal{background:var(--card);border:2px solid var(--red);border-radius:var(--radius);padding:28px;max-width:420px;width:90%;box-shadow:0 8px 40px rgba(255,26,26,.2);transform:scale(.9);transition:transform .2s}
.modal-overlay.active .modal{transform:scale(1)}
.modal h2{font-family:"Press Start 2P",monospace;font-size:12px;color:var(--red);margin-bottom:16px}
.modal p{color:var(--ink-dim);margin-bottom:20px;line-height:1.8}
.modal-actions{display:flex;gap:8px;justify-content:flex-end}

/* ─── Skeleton Loading ─── */
.skeleton{animation:shimmer 1.5s infinite}
@keyframes shimmer{0%{opacity:.3}50%{opacity:.7}100%{opacity:.3}}
.skel-row{height:44px;background:rgba(255,26,26,.05);border-bottom:1px solid rgba(255,26,26,.05)}

/* ─── Responsive ─── */
@media(max-width:768px){
.stats-grid{grid-template-columns:repeat(2,1fr)}
.header h1{font-size:11px}
.toolbar{flex-direction:column;align-items:stretch}
.search-box{width:100%}
table{font-size:11px}
td,th{padding:8px 10px}
.container{padding:12px}
}
@media(max-width:480px){
.stats-grid{grid-template-columns:1fr}
}

/* ─── Matrix BG ─── */
.matrix-bg{position:fixed;inset:0;z-index:-1;opacity:.04}
</style></head>
<body>

<canvas class="matrix-bg" id="matrix-bg"></canvas>

<header class="header">
    <div class="header-brand">
        <h1>NIGHTJAR <span>ADMIN</span></h1>
        <div class="header-status">
            <div class="status-dot"></div>
            <span id="admin-user">OPERATOR</span>
        </div>
    </div>
    <div class="header-actions">
        <a href="/scoreboard" class="btn btn-cyan btn-sm btn-icon">◉ SCOREBOARD</a>
        <a href="/hub" class="btn btn-yellow btn-sm btn-icon">◈ HUB</a>
        <button class="btn btn-sm" onclick="logout()">⏻ LOGOUT</button>
    </div>
</header>

<div class="container">
    <!-- Stats Cards -->
    <div class="stats-grid" id="stats-grid">
        <div class="stat-card">
            <div class="stat-label">REGISTERED PLAYERS</div>
            <div class="stat-value" id="stat-players">—</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">TOTAL OPERATIVES</div>
            <div class="stat-value" id="stat-users">—</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">FLAG SUBMISSIONS</div>
            <div class="stat-value" id="stat-subs">—</div>
            <div class="stat-sub" id="stat-correct"></div>
        </div>
        <div class="stat-card">
            <div class="stat-label">LEADING PLAYER</div>
            <div class="stat-value" id="stat-top" style="font-size:14px;color:var(--red)">—</div>
            <div class="stat-sub" id="stat-top-score"></div>
        </div>
    </div>

    <!-- Toolbar -->
    <div class="toolbar">
        <div class="toolbar-left">
            <input type="text" class="search-box" id="search" placeholder="⌕  Search players..." oninput="filterPlayers()">
        </div>
        <div style="display:flex;gap:8px">
            <button class="btn btn-green btn-sm btn-icon" onclick="loadData()">↻ REFRESH</button>
            <button class="btn btn-danger btn-sm btn-icon" onclick="confirmReset()">⚠ RESET ALL</button>
        </div>
    </div>

    <!-- Players Panel -->
    <div class="panel">
        <div class="panel-header">
            <div class="panel-title">REGISTERED PLAYERS <span class="badge" id="player-count">0</span></div>
        </div>
        <div style="overflow-x:auto">
            <table>
                <thead>
                    <tr>
                        <th style="width:40px">#</th>
                        <th>PLAYER</th>
                        <th>SCORE</th>
                        <th>ROOM</th>
                        <th>SUBS</th>
                        <th>REGISTERED</th>
                        <th>ACTIONS</th>
                    </tr>
                </thead>
                <tbody id="players-body">
                    <tr><td colspan="7" style="text-align:center;padding:40px;color:var(--ink-dim)">Loading intel...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Confirm Modal -->
<div class="modal-overlay" id="modal-overlay">
    <div class="modal">
        <h2 id="modal-title">CONFIRM ACTION</h2>
        <p id="modal-body">Are you sure?</p>
        <div class="modal-actions">
            <button class="btn btn-sm" onclick="closeModal()">CANCEL</button>
            <button class="btn btn-danger btn-sm" id="modal-confirm">CONFIRM</button>
        </div>
    </div>
</div>

<!-- Toast Container -->
<div class="toast-container" id="toast-container"></div>

<script>
// ─── Matrix background ───
(function(){
const c=document.getElementById('matrix-bg'),x=c.getContext('2d');
const G='01ABCDEF<>/{}$#%';
let drops=[];
function resize(){c.width=window.innerWidth;c.height=window.innerHeight;drops=Array.from({length:Math.ceil(c.width/14)},()=>Math.random()*-80)}
function draw(){x.fillStyle='rgba(6,0,8,.06)';x.fillRect(0,0,c.width,c.height);x.font='14px monospace';
drops.forEach((y,i)=>{x.fillStyle=Math.random()<.08?'#ffe600':'#ff1a1a';x.fillText(G[Math.random()*G.length|0],i*14,y*14);drops[i]=y*14>c.height&&Math.random()>.97?0:y+1});requestAnimationFrame(draw)}
resize();draw();window.addEventListener('resize',resize)})();

// ─── State ───
let allPlayers=[];
let pendingAction=null;

// ─── API Helpers ───
async function api(url,opts={}){
    const res=await fetch(url,{...opts,headers:{'Content-Type':'application/json',...(opts.headers||{})}});
    let data={};
    try{data=await res.json()}catch(e){}
    if(res.status===401){window.location.href='/';throw new Error('Session expired')}
    if(!res.ok){
        const d=data.detail;
        throw new Error(typeof d==='string'?d:'Request failed');
    }
    return data;
}

// Usernames are user-controlled: never put them into HTML unescaped.
function esc(v){
    return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function logout(){
    try{await fetch('/api/logout',{method:'POST'})}catch(e){}
    window.location.href='/';
}

function toast(msg,err=false){
    const t=document.createElement('div');
    t.className='toast'+(err?' error':'');
    t.textContent=(err?'✗ ':'✓ ')+msg;
    document.getElementById('toast-container').appendChild(t);
    setTimeout(()=>{t.style.opacity='0';t.style.transform='translateY(20px)';setTimeout(()=>t.remove(),300)},3500);
}

// ─── Load Data ───
async function loadData(){
    try{
        const [players,stats,me]=await Promise.all([api('/api/admin/players'),api('/api/admin/stats'),api('/api/me')]);
        allPlayers=players;
        document.getElementById('admin-user').textContent=me.username.toUpperCase();
        
        // Stats
        document.getElementById('stat-players').textContent=stats.total_players;
        document.getElementById('stat-users').textContent=stats.total_users;
        document.getElementById('stat-subs').textContent=stats.total_submissions;
        document.getElementById('stat-correct').textContent=stats.correct_submissions+' correct';
        if(stats.top_player){
            document.getElementById('stat-top').textContent=stats.top_player.name;
            document.getElementById('stat-top-score').textContent='Score: '+stats.top_player.score;
        }else{
            document.getElementById('stat-top').textContent='—';
            document.getElementById('stat-top-score').textContent='';
        }
        
        filterPlayers();  // re-applies the active search, if any
    }catch(e){
        toast(e.message,true);
    }
}

function renderPlayers(players){
    // rank by score among competing (non-admin) players
    const sorted=players.filter(u=>!u.is_admin).sort((a,b)=>b.score-a.score);
    const rankMap={};
    sorted.forEach((u,i)=>rankMap[u.id]=i+1);

    const body=document.getElementById('players-body');
    document.getElementById('player-count').textContent=players.length;

    if(!players.length){
        body.innerHTML='<tr><td colspan="7" style="text-align:center;padding:40px;color:var(--ink-dim)">No players registered yet</td></tr>';
        return;
    }

    body.innerHTML=players.map(u=>{
        const rank=rankMap[u.id];
        const rankClass=rank&&rank<=3?'rank-'+rank:'rank-n';
        const created=u.created_at?new Date(u.created_at).toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}):'—';

        return `<tr data-user="${u.id}">
            <td><span class="player-rank ${rankClass}">${u.is_admin?'★':rank}</span></td>
            <td><div class="player-name">${esc(u.username)}${u.is_admin?' <span style="font-size:9px;color:var(--cyan)">[ADMIN]</span>':''}</div></td>
            <td>
                <div class="inline-edit">
                    <input class="inline-input" type="number" value="${u.score}" id="score-${u.id}" min="0">
                    <button class="btn btn-green btn-sm" onclick="updateScore(${u.id})" title="Save score">✓</button>
                </div>
            </td>
            <td>
                <div class="inline-edit">
                    <input class="inline-input" type="number" value="${u.current_room}" id="room-${u.id}" min="1" max="11">
                    <button class="btn btn-cyan btn-sm" onclick="updateRoom(${u.id})" title="Save room">✓</button>
                </div>
            </td>
            <td style="text-align:center">
                <span style="color:var(--green)">${u.correct_submissions}</span>/<span style="color:var(--ink-dim)">${u.total_submissions}</span>
            </td>
            <td style="font-size:10px;color:var(--ink-dim)">${created}</td>
            <td>
                <div class="actions-cell">
                    <button class="btn btn-cyan btn-sm" data-action="toggle-admin" data-id="${u.id}" data-name="${esc(u.username)}" data-admin="${u.is_admin?1:0}" title="Toggle admin">${u.is_admin?'REVOKE ADMIN':'MAKE ADMIN'}</button>
                    <button class="btn btn-danger btn-sm" data-action="delete-user" data-id="${u.id}" data-name="${esc(u.username)}">REMOVE</button>
                </div>
            </td>
        </tr>`;
    }).join('');
}

// ─── Row actions (event delegation; no user data inside inline JS) ───
document.getElementById('players-body').addEventListener('click',e=>{
    const el=e.target.closest('[data-action]');
    if(!el)return;
    e.stopPropagation();
    const id=parseInt(el.dataset.id,10),name=el.dataset.name||'';
    if(el.dataset.action==='toggle-admin')toggleAdmin(id,name,el.dataset.admin==='1');
    else if(el.dataset.action==='delete-user')confirmDeleteUser(id,name);
});

// ─── Search/Filter ───
function filterPlayers(){
    const q=document.getElementById('search').value.toLowerCase();
    if(!q){renderPlayers(allPlayers);return}
    renderPlayers(allPlayers.filter(u=>u.username.toLowerCase().includes(q)));
}

// ─── Actions ───
async function updateScore(id){
    const val=parseInt(document.getElementById('score-'+id).value);
    if(isNaN(val)||val<0)return toast('Invalid score',true);
    try{
        await api(`/api/admin/users/${id}/score`,{method:'PUT',body:JSON.stringify({score:val})});
        toast('Score updated');
        loadData();
    }catch(e){toast(e.message,true)}
}

async function updateRoom(id){
    const val=parseInt(document.getElementById('room-'+id).value);
    if(isNaN(val)||val<1||val>11)return toast('Room must be 1-11',true);
    try{
        await api(`/api/admin/users/${id}/room`,{method:'PUT',body:JSON.stringify({room:val})});
        toast('Room updated');
        loadData();
    }catch(e){toast(e.message,true)}
}

async function toggleAdmin(userId,username,currentStatus){
    try{
        await api(`/api/admin/users/${userId}/toggle-admin`,{method:'PUT'});
        toast(`${username} admin → ${!currentStatus}`);
        loadData();
    }catch(e){toast(e.message,true)}
}

// ─── Confirmation Modals ───
function showModal(title,body,onConfirm){
    document.getElementById('modal-title').textContent=title;
    document.getElementById('modal-body').textContent=body;
    document.getElementById('modal-overlay').classList.add('active');
    pendingAction=onConfirm;
    document.getElementById('modal-confirm').onclick=async()=>{
        const action=pendingAction;  // closeModal() clears pendingAction, so grab it first
        closeModal();
        if(action)await action();
    };
}
function closeModal(){
    document.getElementById('modal-overlay').classList.remove('active');
    pendingAction=null;
}

function confirmDeleteUser(id,name){
    showModal('REMOVE PLAYER',`Remove player "${name}" and all their submissions? This cannot be undone.`,async()=>{
        try{
            await api(`/api/admin/users/${id}`,{method:'DELETE'});
            toast(`User "${name}" removed`);
            loadData();
        }catch(e){toast(e.message,true)}
    });
}

function confirmReset(){
    showModal('⚠ RESET ALL SCORES','This will reset ALL player scores to 0 and clear all progress. Are you absolutely sure?',async()=>{
        try{
            await api('/api/admin/reset-scores',{method:'POST'});
            toast('All scores and progress reset');
            loadData();
        }catch(e){toast(e.message,true)}
    });
}

// ─── Keyboard shortcuts ───
document.addEventListener('keydown',e=>{
    if(e.key==='Escape')closeModal();
    if(e.key==='r'&&e.ctrlKey){e.preventDefault();loadData()}
});

// ─── Auto-refresh ───
loadData();
setInterval(()=>{
    const a=document.activeElement;
    const editing=a&&a.classList&&a.classList.contains('inline-input');
    const modalOpen=document.getElementById('modal-overlay').classList.contains('active');
    if(!editing&&!modalOpen)loadData();
},15000);
</script>
</body></html>
